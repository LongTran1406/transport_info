services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - ./data/postgres:/var/lib/postgresql/data 

  airflow:
    image: apache/airflow:2.10.5
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements.txt:/requirements.txt
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      bash -c "
        set -e
        pip install --no-cache-dir -r /requirements.txt
        airflow db migrate
        airflow users create --username admin --password \"$$AIRFLOW_ADMIN_PASSWORD\" --firstname Admin --lastname Admin --role Admin --email admin@example.com || true
        airflow scheduler &
        exec airflow webserver
      "

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 10s
      start_period: 2m
      retries: 3

  create-buckets:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Connecting to MinIO..."

        until mcli alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 2
        done

        echo "MinIO alias configured."

        until mcli ls local >/dev/null 2>&1; do
          echo "Waiting for S3 API..."
          sleep 2
        done

        for bucket in bronze silver gold; do
          mcli mb --ignore-existing "local/$$bucket"
        done

        for bucket in bronze silver gold; do
          mcli ilm rule add "local/$$bucket" --expire-days 30
        done

        echo "Bucket setup completed."
  
  bronze-realtime-poller:
    image: python:3.12-slim
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./dags/module/bronze_realtime_ingestion.py:/app/bronze_realtime_ingestion.py
    command: >
      bash -c "pip install --no-cache-dir requests python-dotenv gtfs-realtime-bindings minio &&
              python -u bronze_realtime_ingestion.py"
    restart: always